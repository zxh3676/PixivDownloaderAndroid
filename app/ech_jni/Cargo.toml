[package]
name = "pxdl_ech"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
serde_json = "1"
jni = "0.21"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
reqwest = { version = "0.13", default-features = false, features = [
    "charset",
    "rustls",
] }
rustls = "0.23"

[profile.release]
strip = true
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
